# pre-commit hooks.
#
# Every `rev` is a full commit SHA (the same supply-chain rule CI applies): a
# tag is a remote-controlled pointer, so pinning the SHA makes local and CI runs
# execute the same code. The tag in the trailing comment resolves bumps.
#
# Not a replacement for the `lint` job in backend-tests.yml, which stays the
# gate: pre-commit catches violations while the author still has context, and
# the redundancy is deliberate because --no-verify can bypass a hook.
#
# Windows quirk: `language: system` hooks run whatever `bash` is first on PATH,
# which here is WSL's bash (different filesystem, different python) and fails
# with exit 127 or "No module named ruff". Check which bash answered before
# editing this file; Git-for-Windows' bash runs the same config green.
repos:
  # ruff: local hooks running the SAME commands, from the SAME directory, as the
  # `lint` job. Not the ruff-pre-commit python hooks: ruff resolves config
  # per-file, and scripts/ has no pyproject/ruff.toml, so a repo-root run lints
  # scripts/ against ruff defaults while `cd backend` gives every file a config.
  # pass_filenames: false is required, not cosmetic -- pre-commit passes
  # repo-root-relative paths, which a hook running from backend/ would resolve
  # against the wrong directory.
  #
  # The hooks locate the interpreter themselves: bare `ruff` is not on PATH,
  # WSL's bash breaks `python -m ruff`, and pre-commit shlex-splits `entry` so
  # quoted fallbacks do not survive. They prefer the in-repo venv, then one level
  # up, then `python`, always via `-m ruff` so CI uses the pinned ruff==0.16.10.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: >-
          bash -c 'cd backend &&
          PY=venv/Scripts/python.exe;
          [ -x "$PY" ] || PY=../venv/Scripts/python.exe;
          [ -x "$PY" ] || PY=python;
          "$PY" -m ruff check .'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ruff-format
        name: ruff format (format)
        entry: >-
          bash -c 'cd backend &&
          PY=venv/Scripts/python.exe;
          [ -x "$PY" ] || PY=../venv/Scripts/python.exe;
          [ -x "$PY" ] || PY=python;
          "$PY" -m ruff format --check .'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Invisible in review, but it accumulates until a diff is unreviewable.
      - id: trailing-whitespace
        # Exclusions, not conveniences: backend/docs/changes.md is append-only
        # and byte-gated by scripts/doc_claims_baseline.json, and binary images
        # (a 3.7 MB PNG fixture) decode differently if a byte moves.
        exclude: ^(backend/docs/changes\.md|.*\.(png|jpg|jpeg|gif|ico|webp))$

      # A YAML syntax error makes GitHub reject the push, so no gate runs.
      - id: check-yaml

      # Catch committed conflict markers before review.
      - id: check-merge-conflict

      # Fast local half of secret scanning; gitleaks is the gate.
      - id: detect-private-key