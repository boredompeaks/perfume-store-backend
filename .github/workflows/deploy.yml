# Release-time deploy. Runs no tests of its own: triggered by backend-tests
# completion (so a red suite never reaches it) and refuses unless secret-scan.yml
# also succeeded on the same commit. A second test run here could only disagree
# with the first.
#
# master is deliberately absent from RELEASE_BRANCHES: it stays deployable but
# is released by promotion, never by a push-triggered deploy. The list is the
# only place a deploy can originate, and it also filters frontend-only pushes.
#
# NOT A RELEASE IS NOT A FAILURE: `workflow_run` fires for every backend-tests
# completion, including the pull_request run of a promotion PR and pushes to
# non-release branches. Those report NEUTRAL (allow=false) and skip the release
# job; a red check on every PR head is a gate nobody reads. Real release
# attempts still HARD FAIL on a red suite, a red/missing secret scan or a
# timed-out scan.
#
# DORMANT BY DEFAULT: the release job also needs DEPLOY_ENABLED == 'true'. There
# is no production host or DEPLOY_* secret here, so an unguarded job would ssh
# at an empty host on every green push and fail forever. An operator opts in
# once a real host exists (plus environment secrets and reviewers).
#
# The deploy is one ssh call running scripts/release.sh - the same script an
# operator runs by hand. That host keeps a git clone at DEPLOY_DIR and its own
# untracked .env; nothing is synced from Actions, so no credential crosses.
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY; optional
# DEPLOY_KNOWN_HOSTS (without it first contact uses accept-new, which still
# refuses a CHANGED key). Optional variables: DEPLOY_BRANCHES, DEPLOY_DIR,
# DEPLOY_URL.
#
# UNTRACKED-IN-TREE COLLISION: git refuses to overwrite the host's owner-local
# untracked files with newly tracked paths, so the remote command retries the
# checkout after moving aside exactly the untracked files the target tree
# tracks, preserved as <name>.predeploy-<epoch> - never deleted, since an owner
# copy may carry wiring the committed file does not.
name: deploy

on:
  workflow_run:
    workflows: [backend-tests]
    types: [completed]

# One release per commit; never cancel one mid-flight.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.allow.outputs.sha }}
      ref: ${{ steps.allow.outputs.ref }}
      allow: ${{ steps.allow.outputs.allow }}
    # Job-level permissions REPLACE the top-level block, so contents: read is
    # restated. actions: read is needed by the secret-scan step's `gh api` call;
    # unlisted scopes are `none` there, so without it that call 403s and the gate
    # fails on every push. The release job keeps contents: read alone (ssh only).
    permissions:
      contents: read
      actions: read
    steps:
      # Fail before any credential is touched, naming the reason. The branch
      # list lives HERE and nowhere else.
      - name: Allow a green push run on a release branch only
        id: allow
        env:
          RELEASE_BRANCHES: ${{ vars.DEPLOY_BRANCHES || 'spec-comp,feat/add-frontend' }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Neutral, not red: this trigger is not a release request.
          if [ "$RUN_EVENT" != "push" ]; then
            echo "no release: $RUN_WORKFLOW ran on '$RUN_EVENT', not a push."
            echo "allow=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case ",$RELEASE_BRANCHES," in
            *",$RUN_BRANCH,"*) ;;
            *)
              echo "no release: '$RUN_BRANCH' is not a release branch ($RELEASE_BRANCHES)."
              echo "allow=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Past here a release IS requested; every condition fails hard.
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "refusing: $RUN_WORKFLOW concluded '$RUN_CONCLUSION' on $RUN_SHA."
            exit 1
          fi
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$RUN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "allow=true" >> "$GITHUB_OUTPUT"

      # The secret scan may still be running (it runs in parallel with the
      # backend suite), so poll rather than race; any terminal verdict other
      # than success, or no run, refuses. Skipped when no release was requested,
      # or it would burn 300s waiting for a push scan a PR run never has.
      - name: Require the secret scan to have passed on this commit
        if: steps.allow.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SCAN_WORKFLOW: secret-scan.yml
          SCAN_WAIT_SECONDS: 300
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + SCAN_WAIT_SECONDS ))
          while :; do
            conclusion=$(gh api "repos/$REPO/actions/workflows/$SCAN_WORKFLOW/runs?head_sha=$RUN_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push")] | first | .conclusion // "none"')
            case "$conclusion" in
              success)
                echo "$SCAN_WORKFLOW passed on $RUN_SHA."
                break
                ;;
              none)
                ;;
              *)
                echo "refusing: $SCAN_WORKFLOW concluded '$conclusion' on $RUN_SHA."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "refusing: no $SCAN_WORKFLOW run on $RUN_SHA succeeded within ${SCAN_WAIT_SECONDS}s."
              exit 1
            fi
            echo "waiting for $SCAN_WORKFLOW on $RUN_SHA (last verdict: $conclusion)"
            sleep 15
          done

  deploy:
    name: release
    needs: gate
    # Both required: the gate's verdict, and the operator's DEPLOY_ENABLED
    # opt-in (no production host or DEPLOY_* secrets here). Every real security
    # gate still runs in `gate`.
    if: needs.gate.outputs.allow == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Lets the repo require review for releases and scope secrets to this env.
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
    steps:
      # Secrets arrive via the step env, go to a 0600 temp file deleted by the
      # trap; nothing echoes them and there is no `set -x`, so the log cannot
      # leak a key. The remote command is an `&&` chain (ssh reports the last
      # status, it stops at the first failure on any POSIX shell, and
      # release.sh has its own `set -euo pipefail`).
      # The checkout retry handles the untracked-in-tree collision described at
      # the top of this file. POSIX sh only; backslash-dollar keeps $f and the
      # date call REMOTE, while $DEPLOY_DIR/$RELEASED_SHA expand locally.
      - name: Run the release sequence on the deploy host
        env:
          RELEASED_SHA: ${{ needs.gate.outputs.sha }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/perfume-store' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp)"
          known_hosts="$(mktemp)"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
            host_key_check=yes
          else
            : > "$known_hosts"
            host_key_check=accept-new
          fi
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o "StrictHostKeyChecking=$host_key_check" \
            -o "UserKnownHostsFile=$known_hosts" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && git fetch --quiet --prune origin && if ! git -c advice.detachedHead=false checkout --quiet --detach '$RELEASED_SHA'; then git ls-files --others --exclude-standard | while IFS= read -r f; do if git cat-file -e '$RELEASED_SHA:'\"\$f\" 2>/dev/null; then mv -- \"\$f\" \"\$f.predeploy-\$(date +%s)\"; fi; done; git -c advice.detachedHead=false checkout --quiet --detach '$RELEASED_SHA'; fi && if [ -x ./scripts/release-uat.sh ]; then exec ./scripts/release-uat.sh; else exec ./scripts/release.sh; fi"