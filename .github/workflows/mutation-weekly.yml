# Weekly automated mutation testing, scoped to two files.
#
# scripts/mutation_evidence.py REPLAYS recorded mutations, so it cannot answer
# "which line in orders/state.py has no test pinning it". mutmut generates its
# own mutants; the two compose.
#
# mutmut 2.5.1, not cosmic-ray: mutmut's `paths_to_mutate` is a per-file
# allow-list, while cosmic-ray's unit is a module and cannot be pointed at
# exactly these two files in different packages. mutmut 3 hard-requires
# pytest>=6.2.5, but this repo's floor is `manage.py test`; 2.5.1 takes any
# runner command.
#
# NEVER A GATE: schedule + workflow_dispatch only, no PR/push trigger, and
# `--CI` exits 0 when mutants survive - survival is information, not a red
# build. A non-zero exit means the HARNESS broke.
#
# Writes nothing into the repo: mutmut runs against a COPY of backend/ under
# RUNNER_TEMP, and the final step asserts `git status --porcelain` is empty, so
# even a cancelled run cannot leave a mutated source file behind.
name: mutation-weekly

on:
  schedule:
    # Weekly at 04:41 UTC Monday. Scheduled runs come from the DEFAULT BRANCH
    # (feat/add-frontend; master is legacy). The fixed slot avoids
    # doc-claims-nightly's 03:17, and an unchanged target file skips the run.
    - cron: "41 4 * * 1"
  # Manual runs, without editing the cron above (also the API entry point).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-weekly
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    # Measured ~79s per mutant over 186 covered mutants plus baseline (~250 min),
    # so the cap sits above that: a job killed by its own timeout publishes NO
    # summary (later steps do not run), and an overrun must still report.
    timeout-minutes: 330
    env:
      # Same dummy Razorpay values as backend-tests.yml: no real .env is read.
      DJANGO_DEBUG: "true"
      RAZORPAY_KEY_ID: rzp_test_CI_DUMMY
      RAZORPAY_KEY_SECRET: ci-dummy-secret
      # mutmut decodes subprocess output as UTF-8 and dies on an undecodable
      # byte: a Django run emitting a cp1252 em dash (0x97) raises
      # UnicodeDecodeError and aborts the whole run.
      PYTHONIOENCODING: utf-8
      # DATABASE_URL unset on purpose: settings.py falls back to SQLite, and a
      # score is comparable run-to-run only if the engine is pinned. It describes
      # the SQLite engine; Postgres is the suite's concern.
      #
      # SANDBOX is NOT set at job level: the `runner` context is illegal in a
      # job `env:` (GitHub refuses the job semantically, which PyYAML cannot
      # see), so the step that needs it declares it in its own env. That is why
      # actionlint, not PyYAML, is the oracle for workflow changes here.
    steps:
      # Full commit SHA + tag; never widen a pin. Same SHAs as backend-tests.yml,
      # so the repo has one set of action pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 1 is enough: mutmut is not patch-based and needs no history.
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies (includes mutmut==2.5.1)
        working-directory: backend
        run: pip install -r requirements.txt

      # mutmut edits a tracked file in place, so a dirty tree would mean
      # mutating someone's uncommitted work.
      - name: Assert the checkout is clean before mutating
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::refusing to mutate a dirty checkout:" "${dirty}"
            exit 1
          fi

      # Re-measuring an unchanged score is noise. Compares the two files' blob
      # SHAs at the last successful run's head_sha against HEAD via the API, so
      # no git history is needed.
      - name: Check if target files changed since last run
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last_sha=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mutation-weekly.yml/runs?status=success&per_page=1" \
            | python -c "import sys,json; d=json.load(sys.stdin); print(d['workflow_runs'][0]['head_sha'] if d['workflow_runs'] else '')")
          if [ -z "${last_sha}" ]; then
            echo "No previous successful run; proceeding."
            echo "changed=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed=0
          for f in backend/orders/state.py backend/common/permissions.py; do
            current=$(git rev-parse "HEAD:${f}")
            last=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/${f}?ref=${last_sha}" \
              | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
            if [ "${current}" != "${last}" ]; then
              echo "${f} changed since last run"
              changed=1
            fi
          done
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          if [ "${changed}" -eq 0 ]; then
            echo "No target files changed since last successful run; skipping."
          fi

      # The copy keeps mutmut's in-place rewrites, .mutmut-cache and reports out
      # of the repository. .git is NOT carried over, so nothing in the sandbox
      # can reach the real tree. SANDBOX is declared here: `runner.temp` is
      # legal in a step env, illegal at job level.
      - name: Copy backend/ into an out-of-tree sandbox
        if: steps.changed.outputs.changed == '1'
        env:
          SANDBOX: ${{ runner.temp }}/mutation-sandbox
        run: |
          set -euo pipefail
          mkdir -p "${SANDBOX}"
          tar -C backend --exclude=.git -cf - . | tar -C "${SANDBOX}" -xf -
          test -f "${SANDBOX}/manage.py"
          echo "sandbox=${SANDBOX}"

      # use_coverage keeps only mutants on lines a test executes: 246 mutants
      # without it, 186 with. The 60 dropped would be guaranteed survivors -
      # noise reported as test-suite weakness.
      - name: Coverage baseline for the mutation scope
        if: steps.changed.outputs.changed == '1'
        working-directory: ${{ runner.temp }}/mutation-sandbox
        run: |
          set -euo pipefail
          python -m coverage run manage.py test \
            orders common accounts products shipping --verbosity 0
          test -f .coverage

      # `--runner` OVERRIDES the config key: mutmut gives the flag no default,
      # so the config merge supplies backend/pyproject.toml's value when it is
      # absent. paths_to_mutate/use_coverage/simple_output/no_progress follow the
      # same falsy-default rule.
      # The label list is the scope's cost: 909 of 1836 tests, run green (mutmut
      # aborts if the baseline is not clean). The omitted `tests` package holds
      # RBAC/admin tests importing common/permissions.py, so the score is a lower
      # bound - see the summary's fidelity note.
      - name: Run mutmut (scope and flags from backend/pyproject.toml)
        id: mutate
        if: steps.changed.outputs.changed == '1'
        working-directory: ${{ runner.temp }}/mutation-sandbox
        run: |
          set -uo pipefail
          python -m mutmut run \
            --runner "python manage.py test orders common accounts products shipping --verbosity 0" \
            --CI
          status=$?
          echo "mutmut_exit=${status}"
          # Not `set -e` on purpose: the exit is reported and re-raised so the
          # `if: always()` summary step still runs.
          exit "${status}"

      # Quotes mutmut's own HTML report rather than recomputing it. The row
      # regex must NOT anchor on </tr>: mutmut emits no closing </tr> on any row,
      # so an anchored pattern matches nothing - "a green gate that read nothing".
      - name: Publish the mutation summary
        if: always()
        working-directory: ${{ runner.temp }}/mutation-sandbox
        run: |
          set -uo pipefail
          if [ "${{ steps.changed.outputs.changed }}" != "1" ]; then
            {
              echo "### mutation-weekly -- SKIPPED"
              echo
              echo 'Neither target file changed since the last successful run.'
              echo 'No mutation score was measured this week.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python -m mutmut html >/dev/null 2>&1 || true
          index="html/index.html"
          if [ ! -f "${index}" ]; then
            {
              echo "### mutation-weekly -- NO REPORT"
              echo
              echo 'mutmut wrote no html/index.html, so no score was measured.'
              echo "This is a harness failure, not a mutation score of zero."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::no mutation report produced"
            exit 1
          fi
          headline="$(grep -ao 'Killed [0-9]* out of [0-9]* mutants' "${index}" | head -n1 || true)"
          rows="$(grep -ao '<tr><td><a href="[^"]*">[^<]*</a></td><td>[0-9]*</td><td>[0-9]*</td><td>[0-9]*</td><td>[^<]*</td><td>[0-9]*</td>' "${index}" \
            | sed -e 's#.*>\([^<]*\)</a></td><td>\([0-9]*\)</td><td>\([0-9]*\)</td><td>\([0-9]*\)</td><td>\([^<]*\)</td><td>\([0-9]*\)</td>#| \1 | \2 | \3 | \4 | \5 | \6 |#' || true)"
          rowcount="$(printf '%s\n' "${rows}" | grep -c '|' || true)"
          {
            echo "### mutation-weekly"
            echo
            echo "Runner: \`mutmut\` (scope and flags from \`backend/pyproject.toml\`)"
            echo "Killed mutants, mutmut's own report: \`${headline:-unparsed}\`"
            echo
            echo '| File | Total | Skipped | Killed | % killed | Survived |'
            echo '| --- | --- | --- | --- | --- | --- |'
            printf '%s\n' "${rows}"
            echo
            echo "mutmut exit: \`${{ steps.mutate.outcome }}\`"
            echo
            echo '**Not a gate.** schedule + workflow_dispatch only; no pull_request'
            echo 'trigger exists, so this can never block a merge, and `--CI` makes a'
            echo 'surviving mutant exit 0.'
            echo
            echo '**Read the scope before reading the percentage.** The runner executes'
            echo '909 of the suite'"'"'s 1836 tests. The `tests` package is excluded for'
            echo 'runtime, not because it is red -- it holds RBAC/admin tests that do'
            echo 'import `common/permissions.py`, so a mutant this scope could not kill'
            echo 'is a scope limitation and not yet a finding about the tests.'
            echo
            if [ "${rowcount}" -lt 2 ]; then
              echo '> **INCOMPLETE** fewer than two files were reported. Treat every'
              echo '> number above as unmeasured rather than as a score.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${rowcount}" -lt 2 ]; then
            echo "::warning::only ${rowcount} file row(s) in the mutation report"
          fi

      # After in-place rewrites, the checkout must be exactly as it was.
      - name: Assert the repo tree is untouched
        if: always()
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::the mutation run wrote into the repository tree:" "${dirty}"
            exit 1
          fi
          echo "repo tree clean after the mutation run"

      - name: Upload the mutation report
        if: steps.changed.outputs.changed == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation-sandbox/html/
          retention-days: 7