# SPEC-22-11: every action is pinned to a full commit SHA with the tag in a
# trailing comment. A mutable tag (@v4) is a remote-controlled pointer to
# whatever that tag says today, so pinning is supply-chain hardening: to move
# an action, resolve the new tag with
# `git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag>^{}`
# (the `^{}` peel matters for an annotated tag) and replace the SHA - never
# widen the pin back to a tag.
name: secret-scan

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]

# Least privilege: gitleaks only reads the repo. pull-requests: read is
# required by gitleaks-action's PR mode (it lists the PR's commits via the
# API; without it ScanPullRequest 403s "Resource not accessible by
# integration" and the check fails before scanning — seen on PR #6).
permissions:
  contents: read
  pull-requests: read

# One run per ref; a new push to the same ref cancels the stale run.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so gitleaks can scan every commit on push events.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: gitleaks-action@v2 declares no inputs; it pins and downloads
        # its own gitleaks binary. Config lives in .gitleaks.toml (repo root).
