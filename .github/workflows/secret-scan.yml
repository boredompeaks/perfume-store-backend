# Every action is pinned to a full commit SHA with the tag in a trailing
# comment: a mutable tag is a remote-controlled pointer, so pinning is
# supply-chain hardening. Resolve bumps with `git ls-remote ... refs/tags/<tag>^{}`
# and replace the SHA - never widen the pin back to a tag.
name: secret-scan

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]

# Least privilege: gitleaks only reads the repo. `pull-requests: read` is
# required by gitleaks-action's PR mode, which lists the PR's commits; without
# it ScanPullRequest 403s and fails before scanning.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan every commit on push events.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This action declares no inputs; it downloads its own gitleaks binary.
        # Config lives in .gitleaks.toml.
