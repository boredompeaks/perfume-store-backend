name: secret-scan

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]

# Least privilege: gitleaks only reads the repo.
permissions:
  contents: read

# One run per ref; a new push to the same ref cancels the stale run.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit on push events.
          fetch-depth: 0

      - name: gitleaks (pinned v8.18.4)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "v8.18.4"
