# SPEC-22-11: every action is pinned to a full commit SHA with the tag in a
# trailing comment. A mutable tag (@v4) is a remote-controlled pointer to
# whatever that tag says today, so pinning is supply-chain hardening: to move
# an action, resolve the new tag with
# `git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag>^{}`
# (the `^{}` peel matters for an annotated tag) and replace the SHA - never
# widen the pin back to a tag.
name: backend-tests

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
    # The deployment wiring (SPEC-2-10b/22-07) is part of the backend's
    # production path, so a push that only touches it still runs this gate --
    # deploy.yml is triggered by THIS workflow's completion, and a commit with
    # no run here could never be released. scripts/backup.sh is here for the
    # same reason: the backup cadence (R-22.9) is the deploy host's scheduled
    # entry point, so a commit that only changes it still runs the gate.
    #
    # scripts/** sits here IN ADDITION to the two named .sh files, not instead
    # of them, and the two earn their place differently. The named entries are
    # a text contract the suite pins -- tests/test_backup_db.py and
    # tests/test_deployment_contract.py assert these literals in the trigger
    # list -- so a deploy entry point cannot be dropped from the gate by a
    # well-meaning refactor of this file. The glob is what makes the same
    # guarantee true for a file added tomorrow: scripts/doc_claims.py is a
    # BUILD GATE (the "Documentation claim scan" step below runs it), and a
    # commit that only touches the gate's own tooling must still run the gate
    # that executes the tooling. Naming two .sh files stops being true the day
    # a third script lands.
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/backup.sh"
      - "scripts/release.sh"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/backup.sh"
      - "scripts/release.sh"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deploy.yml"

# Least privilege: the suite only needs to read the checkout.
permissions:
  contents: read

# One run per ref; a new push to the same ref cancels the stale run.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI never reads a real .env; dummy Razorpay values prove the suite
      # never depends on live credentials (V-01 containment).
      DJANGO_DEBUG: "true"
      RAZORPAY_KEY_ID: rzp_test_CI_DUMMY
      RAZORPAY_KEY_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, and the remote-tracking refs, because the claim scan
          # below is DIFF-SCOPED: it runs `git diff --unified=0 <base>...HEAD`
          # where <base> is a SHA resolved at RUN TIME -- the step's own
          # DOC_CLAIMS_BASE env, further down. The default fetch-depth: 1
          # checkout fetches neither that SHA nor the history, so the diff
          # would abort with a git error and the step would exit 2, turning
          # the gate red on a green tree. A 3-dot diff also needs a merge base,
          # which a shallow clone cannot compute. The byte-integrity half needs
          # no history, but it is the same command, so the whole step pays this
          # once.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite with coverage gate (fail under 90%)
        run: |
          python -m coverage run manage.py test
          python -m coverage report

      # Prose had no oracle until SPEC-1-B07d (scripts/doc_claims.py). This is
      # a SIBLING step, not a wrapper around the runner, on purpose: the gate
      # above is coverage-gated and a wrapper that shells out to the runner
      # risks perturbing the measurement coverage report is about to gate on.
      #
      # Exit 1 on the mechanically decidable classes only -- a quoted `test_*`
      # name with no `def`, a cited `.py` that does not exist, a `file.py:123`
      # past EOF, or a byte-integrity regression on a tracked doc blob (this
      # repo's changes.md has been silently corrupted three times by shell
      # writes). Undecidable claims (a count, a universal) are printed as
      # warnings and never fail: the script does not judge prose, and a gate
      # that guessed at prose would be a gate that got loosened to pass.
      #
      # The byte baseline (scripts/doc_claims_baseline.json) holds byte FACTS
      # only and is never self-updating -- a self-updating baseline records
      # whatever the prose claimed, which is the defect this exists to catch.
      # If this step ever goes red on PRE-EXISTING claims, that is a finding to
      # report, not a reason to baseline it away.
      #
      # scripts/mutation_evidence.py is deliberately NOT wired here: it is
      # opt-in and slow (it replays six full-suite runs), and it is a
      # pre-publication check for a mutation claim, not a build gate.
      - name: Documentation claim scan (doc_claims)
        working-directory: ${{ github.workspace }}
        # THE BASE MUST MOVE WITH THE PROMOTION, and it must be the ONLY thing
        # that picks it. resolve_base() takes the FIRST hit of --base, then
        # $DOC_CLAIMS_BASE, then origin/$GITHUB_BASE_REF under CI, then the
        # local default -- so a pinned `--base origin/spec-comp` was not merely
        # redundant, it SHADOWED every source below it and made this step scan
        # ZERO claims, permanently (BUG-5, TOOL-01). On a pull_request event
        # HEAD is the merge commit whose SECOND parent is origin/spec-comp, so
        # `origin/spec-comp...HEAD` is empty by construction: a green gate that
        # had read no prose at all, indistinguishable from a gate that passed.
        # Naming no --base hands the decision to the one input that actually
        # tracks the promotion -- the PR's base sha when there is a PR, else the
        # pushed ref's previous tip.
        env:
          DOC_CLAIMS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # `github.event.before` is forty zeros when the ref is CREATED, and
          # `git diff 0000...HEAD` is "fatal: bad object" -> exit 2 -> a red
          # gate on a branch that has never been promoted. A newly created ref
          # has no prior promoted state to diff against, so drop the variable
          # and let resolve_base() fall through to its own defaults. The
          # scanner prints its loud zero-file notice on stderr in that case, so
          # this is an HONEST green rather than a silent one, and the
          # byte-integrity half runs either way.
          if [ -z "${DOC_CLAIMS_BASE}" ] || [ "${DOC_CLAIMS_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "doc_claims: no usable diff base (empty or all-zeros -- branch creation); falling back to the scanner's own defaults."
            unset DOC_CLAIMS_BASE
          fi
          python scripts/doc_claims.py --head HEAD

      # `coverage report` is the gate (fail_under=90 in .coveragerc); the HTML
      # report is a separate step so the upload below always has an artifact to
      # publish -- including on a red gate, where it is the diagnostic.
      # Directory comes from [html] directory in .coveragerc.
      - name: Generate coverage HTML report
        if: always()
        run: python -m coverage html

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 7
