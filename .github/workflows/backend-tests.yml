# Every action is pinned to a full commit SHA with its tag in a trailing
# comment: a mutable tag is a remote-controlled pointer, so pinning is
# supply-chain hardening. Resolve bumps with `git ls-remote ... refs/tags/<tag>^{}`
# and replace the SHA - never widen the pin back to a tag.
#
# Every pin targets an action whose `runs.using` is node24 (GitHub deprecates
# Node 20). A future bump must check that, not assume it.
name: backend-tests

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
    # Deployment wiring and scripts are part of the backend's production path:
    # deploy.yml triggers on THIS workflow's completion, so a commit that only
    # touches them could otherwise never be released. The named .sh entries are
    # a text contract the suite pins (tests/test_backup_db.py,
    # tests/test_deployment_contract.py); scripts/** covers new scripts, e.g.
    # doc_claims.py, itself a build gate run below.
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/backup.sh"
      - "scripts/release.sh"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]
    # Ruleset 25129526 requires the `postgres` and `lint` contexts on every PR,
    # but rulesets cannot express path-conditional checks and a paths filter
    # meant a frontend-only PR started no run, blocking it on contexts that
    # could not report. So every PR triggers, and each job reports a fast
    # sentinel green when the diff touches no real-gate path (the explicit list
    # after `**` is that set, re-implemented by the change-detection steps and
    # pinned by tests/test_backup_db.py and tests/test_deployment_contract.py).
    paths:
      - "**"
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/backup.sh"
      - "scripts/release.sh"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deploy.yml"

# The suite only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PostgreSQL is the SINGLE CI engine: SQLite cannot manifest the
  # oversell/double-spend/TOCTOU class (no row-level locking) and ignores
  # varchar(n) limits, so it said nothing about production. Every gate lives in
  # this job, and this job alone is the backend gate.
  #
  # pg_gate enforces the failure SET, not a count: "failures=6" cannot tell the
  # six known failures from those six plus a regression. A baseline entry that
  # stopped failing only warns.
  #
  # The redis service exists so the THROTTLE-CACHE live-Redis shared-cache pins
  # EXECUTE instead of skipping, matching the shape the floors were certified on.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Exact tag, not `latest` or a floating minor: the certified baseline
        # was measured on this version, and a silent bump can change failures
        # without a commit, making the baseline untrustworthy.
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: perfume_store
          POSTGRES_USER: perfume
          # Ephemeral CI-only credential for a database that lives and dies in
          # this runner; not a secret, and no real .env is read.
          POSTGRES_PASSWORD: ci_pg_only_not_a_secret
        ports:
          - 5432:5432
        # Without this, a fast test step reaches Postgres before initdb is done
        # and fails with errors that look like a real regression.
        options: >-
          --health-cmd "pg_isready -U perfume -d perfume_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The live-Redis half of the THROTTLE-CACHE pins. They certify cache
      # BUDGET behaviour (shared across connections and a spawned process), not
      # a server-version detail; the protocol-speaking client is hash-pinned in
      # requirements.lock.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # No real .env is read; the dummy Razorpay values prove the suite never
      # depends on live credentials.
      DJANGO_DEBUG: "true"
      RAZORPAY_KEY_ID: rzp_test_CI_DUMMY
      RAZORPAY_KEY_SECRET: ci-dummy-secret
      # settings.py falls back to SQLite silently on an unset/unparseable
      # value, so the engine is asserted below rather than assumed.
      DATABASE_URL: postgres://perfume:ci_pg_only_not_a_secret@localhost:5432/perfume_store
      # Declaring REDIS_URL flips the cache alias from LocMemCache to
      # RedisCache (an empty value would not), so the live-Redis throttle pins
      # RUN and the spawned child inherits it. The hermetic LocMem pins are
      # unaffected: the settings harness scrubs REDIS_URL in subprocesses.
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the claim scan is a three-dot diff against a base
          # resolved at run time, and a shallow clone has neither that object
          # nor a merge base (the diff would abort, exiting 2 on a green tree).
          # The change-detection step also diffs a base, so this one fetch
          # serves both.
          fetch-depth: 0

      # Decide once whether this run is the REAL gate or the sentinel, failing
      # safe towards the real suite: sentinel only when the diff positively
      # contains none of the real-gate paths. Branch creation (all-zeros
      # `before`) and an unknown base (force push) fall through to real=true.
      # The diff is PR-base..merge-HEAD or before..HEAD, so a modified gate file
      # itself counts as backend-relevant.
      - name: Detect backend-relevant changes (real suite vs sentinel)
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          real=true
          if [ -n "${base}" ] \
            && [ "${base}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            real=false
            while IFS= read -r file; do
              case "${file}" in
                backend/*|docker-compose.yml|Procfile|scripts/*|.github/workflows/backend-tests.yml|.github/workflows/deploy.yml)
                  echo "backend-relevant: ${file}"
                  real=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${base}" HEAD)
          fi
          echo "real=${real}"
          echo "real=${real}" >> "${GITHUB_OUTPUT}"

      # When no backend-relevant path changed, this step is the whole job and
      # its success reports the `postgres` context. It installs nothing, and the
      # message states what did not run.
      - name: "Sentinel: no backend-relevant changes (postgres context reports green)"
        if: steps.changes.outputs.real != 'true'
        run: |
          echo "backend-tests/postgres sentinel: this change touches none of backend/**, docker-compose.yml, Procfile, scripts/**, backend-tests.yml, deploy.yml."
          echo "The real PostgreSQL suite (migrations, coverage gate, pg_gate, claim scan, changelog gate) is not applicable and did not run."
          echo "Any backend-relevant change still runs the full suite in this same job; owner-directed ruleset fix PROMOTE-39b."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.real == 'true'
        with:
          python-version: "3.14"
          cache: pip
          # The LOCK, not requirements.txt: the lock decides what installs, so
          # it must drive the cache key; keying on the pointer would serve a
          # cache built from a stale lock.
          cache-dependency-path: backend/requirements.lock

      # requirements.lock is the hash-pinned resolution of requirements.in: it
      # pins transitive dependencies (nothing here imports them directly) and
      # its --hash lines make pip verify every wheel. requirements.txt is only
      # a pointer kept for the documented dev command.
      - name: Install pinned dependencies from the lock
        if: steps.changes.outputs.real == 'true'
        run: pip install -r requirements.lock

      - name: Django system check
        if: steps.changes.outputs.real == 'true'
        run: python manage.py check

      - name: Migration drift check
        if: steps.changes.outputs.real == 'true'
        run: python manage.py makemigrations --check --dry-run

      # settings.py falls back to SQLite silently, so "the job ran" must not be
      # mistaken for "PG ran".
      - name: Assert the engine is PostgreSQL
        if: steps.changes.outputs.real == 'true'
        run: |
          set -euo pipefail
          engine="$(python -c "import os,django;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');django.setup();from django.db import connection;print(connection.settings_dict['ENGINE'])")"
          echo "engine=${engine}"
          if [ "${engine}" != "django.db.backends.postgresql" ]; then
            echo "::error::expected django.db.backends.postgresql, got ${engine} -- this job would certify a SQLite run as PostgreSQL."
            exit 1
          fi

      # `--parallel 4` is MEASURED, not enabled: 27 test ids are red under
      # parallel that serial never reds (throttle budgets shared across
      # connections/processes, the whole-DB restore drill), and repo tags are
      # feature tags, so no `--exclude-tag` split can separate them. The 3.1x
      # speedup is real but unavailable until a `shared_state` tag exists.
      #
      # `pipefail` is deliberately NOT set, so this step's status is tee's 0 and
      # the gate below judges the run by SET: pg_gate exits non-zero on a
      # failure outside scripts/pg_baseline.json, or on a missing/truncated
      # summary - so a crashed run cannot read as clean. The log is tee'd
      # because pg_gate.py reads it.
      - name: Test suite on PostgreSQL (failures judged as a set below)
        if: steps.changes.outputs.real == 'true'
        run: |
          python -m coverage run manage.py test 2>&1 | tee pg-suite.log

      # Repeated from backend/.coveragerc (which a local run honours) so the CI
      # threshold is visible in the workflow that depends on it.
      - name: Coverage report (fail_under=90)
        if: steps.changes.outputs.real == 'true'
        run: python -m coverage report --fail-under=90

      # Two invariants, "shrank = red, grew = notice" (so growth never reds):
      # statements 14005 = the measured file set (catches a data file that never
      # arrived - the failure the parallel path would introduce); tests 2468 =
      # the runner's own count, which falls on a truncated run. An unparseable
      # number is red, never a pass.
      - name: Partial-data invariant (statements + test count)
        if: steps.changes.outputs.real == 'true'
        run: |
          set -euo pipefail
          statements_baseline=14005
          tests_baseline=2468
          # `|| true` so an unreadable report reaches the explicit "could not
          # parse" branch with its own message instead of aborting silently.
          statements="$( (python -m coverage report || true) | awk '$1=="TOTAL"{print $2; exit}')"
          tests="$( (grep -E '^Ran [0-9]+ tests' pg-suite.log || true) | tail -1 | awk '{print $2}')"
          echo "statements=${statements:-<unparsed>} (baseline ${statements_baseline})"
          echo "tests=${tests:-<unparsed>} (baseline ${tests_baseline})"
          for pair in "statements:${statements}:${statements_baseline}" "tests:${tests}:${tests_baseline}"; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            value="${rest%%:*}"
            baseline="${rest#*:}"
            case "${value}" in
              ''|*[!0-9]*)
                echo "::error::could not parse the ${name} count (${name}=${value:-empty}); refusing to certify a number that was not read."
                exit 1
                ;;
            esac
            if [ "${value}" -lt "${baseline}" ]; then
              echo "::error::${name} shrank to ${value} (baseline ${baseline}) -- the run is PARTIAL. If the drop is intended, lower the baseline in this step in the same commit."
              exit 1
            fi
            if [ "${value}" -gt "${baseline}" ]; then
              echo "::notice::${name} grew to ${value} (baseline ${baseline}) -- raise the baseline in this step in the same commit that grew it."
            fi
          done

      - name: Certified PostgreSQL failure-set gate (pg_gate)
        if: steps.changes.outputs.real == 'true'
        working-directory: ${{ github.workspace }}
        run: python scripts/pg_gate.py --log backend/pg-suite.log

      # A SIBLING step, not a wrapper around the runner: the gate above is
      # coverage-gated, and shelling out to the runner from a wrapper risks
      # perturbing that measurement.
      #
      # Exit 1 only on mechanically decidable classes (missing `def`, missing
      # cited file, line past EOF, byte-integrity regression); undecidable
      # claims warn and never fail, since a gate that guessed at prose would get
      # loosened to pass. The byte baseline holds byte FACTS only and never
      # self-updates; red on pre-existing claims is a finding, not a baseline
      # edit.
      #
      # mutation_evidence.py is deliberately NOT wired here: opt-in, slow
      # (replays six full-suite runs), and a pre-publication check, not a gate.
      - name: Documentation claim scan (doc_claims)
        if: steps.changes.outputs.real == 'true'
        working-directory: ${{ github.workspace }}
        # No `--base`: resolve_base() takes the first hit of --base, then
        # $DOC_CLAIMS_BASE, then origin/$GITHUB_BASE_REF. A pinned
        # `--base origin/spec-comp` shadowed those and scanned ZERO claims (on a
        # PR, spec-comp...HEAD is empty by construction). Naming no --base hands
        # the decision to the input that tracks the promotion.
        env:
          DOC_CLAIMS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # `github.event.before` is forty zeros on ref creation, and diffing
          # that is "fatal: bad object" -> exit 2. A new ref has no prior
          # promoted state, so drop the variable and let resolve_base() use its
          # defaults; the scanner still prints a loud zero-file notice.
          if [ -z "${DOC_CLAIMS_BASE}" ] || [ "${DOC_CLAIMS_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "doc_claims: no usable diff base (empty or all-zeros -- branch creation); falling back to the scanner's own defaults."
            unset DOC_CLAIMS_BASE
          fi
          python scripts/doc_claims.py --head HEAD

      # `check` stops a figure being published with no measurement behind it
      # (the printer only stopped one being invented). A sibling of the claim
      # scan for the same reason - no wrapper around the coverage-gated suite -
      # and diff-scoped against the SAME base, so both judge the rows this
      # change added.
      #
      # Returns 1 naming the row when a floor or `failures=N` figure has no
      # artifact recording it. That is a real failure, never baselined away; red
      # on a pre-existing row is a finding to report, not to relax.
      - name: Changelog figure gate (changelog_figures check)
        if: steps.changes.outputs.real == 'true'
        working-directory: ${{ github.workspace }}
        # `--base` is REQUIRED here (unlike the claim scan), so it must use the
        # same variable and branch-creation fallback, or the two steps would
        # judge different row sets.
        env:
          DOC_CLAIMS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${DOC_CLAIMS_BASE}" ] || [ "${DOC_CLAIMS_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "changelog_figures: no usable diff base (branch creation); falling back to the previous tip of this ref."
            DOC_CLAIMS_BASE="HEAD"
          fi
          python scripts/changelog_figures.py check --base "${DOC_CLAIMS_BASE}"

      # Unit tests for the pipeline's own tooling. They were run by nobody, and
      # without scripts/tests/__init__.py discovery reports "Ran 0 tests" (exit
      # 0, or 5 on 3.14). So the guard asserts the COUNT, not the exit code:
      # declared `def test_` functions must be non-zero and equal the runner's
      # count, which catches both an absent suite and a shrunken one. The number
      # is deliberately not pinned here.
      #
      # Workspace-root scoped (`-s scripts` is relative), stdlib only, so no
      # wheel download can red it.
      - name: scripts/tests unit suite (discovery is the defect it catches)
        if: steps.changes.outputs.real == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          status=0
          log="$(python -m unittest discover -s scripts -p "test_*.py" 2>&1)" || status=$?
          printf '%s\n' "${log}"
          expected="$(grep -c "def test_" scripts/tests/*.py | awk -F: '{total += $NF} END {print total + 0}')"
          collected="$(printf '%s\n' "${log}" | sed -n 's/^Ran \([0-9][0-9]*\) tests.*/\1/p' | head -n 1)"
          echo "collected=${collected:-0} declared=${expected}"
          if [ "${collected:-0}" -eq 0 ]; then
            echo "::error::scripts/tests collected 0 tests. The runner's exit code says nothing about whether a suite was found, so this count is the guard."
            exit 1
          fi
          if [ "${collected}" -ne "${expected}" ]; then
            echo "::error::scripts/tests reported ${collected} tests but the sources declare ${expected} def test_ functions; discovery is skipping a file."
            exit 1
          fi
          exit "${status}"

      # Separate from the gate above so the upload always has an artifact,
      # including on a red gate. Directory comes from .coveragerc's [html].
      - name: Generate coverage HTML report
        # always() so the diagnostic exists on a red run; `real` so the
        # sentinel path never reaches python (no coverage data, no interpreter).
        if: always() && steps.changes.outputs.real == 'true'
        run: python -m coverage html

      - name: Upload coverage HTML report
        if: always() && steps.changes.outputs.real == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-postgres
          path: backend/htmlcov/
          retention-days: 7

  # ruff lints AND formats this tree. Config lives in backend/pyproject.toml and
  # the version (ruff==0.16.10) is pinned in requirements.lock, which this job
  # installs - one source, so CI and a local run cannot disagree. A separate job
  # so a dirty tree reports without waiting for the suite, and a red suite never
  # hides an unformatted commit.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Same pins as the `postgres` job above. fetch-depth 0 because the
      # change-detection step diffs a base; ruff still reads only the working
      # tree, so the wider fetch changes no lint verdict.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Identical verdict logic to the `postgres` job's step of the same name;
      # the two jobs must agree, or one context goes green on a change the
      # other gated.
      - name: Detect backend-relevant changes (real suite vs sentinel)
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          real=true
          if [ -n "${base}" ] \
            && [ "${base}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            real=false
            while IFS= read -r file; do
              case "${file}" in
                backend/*|docker-compose.yml|Procfile|scripts/*|.github/workflows/backend-tests.yml|.github/workflows/deploy.yml)
                  echo "backend-relevant: ${file}"
                  real=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${base}" HEAD)
          fi
          echo "real=${real}"
          echo "real=${real}" >> "${GITHUB_OUTPUT}"

      # The `lint` half of the sentinel; the message states what did not run.
      - name: "Sentinel: no backend-relevant changes (lint context reports green)"
        if: steps.changes.outputs.real != 'true'
        run: |
          echo "backend-tests/lint sentinel: this change touches none of backend/**, docker-compose.yml, Procfile, scripts/**, backend-tests.yml, deploy.yml."
          echo "ruff check, ruff format --check, pre-commit --all-files and mypy are not applicable and did not run."
          echo "Any backend-relevant change still runs the full lint gate in this same job; owner-directed ruleset fix PROMOTE-39b."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.real == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install pinned dependencies
        if: steps.changes.outputs.real == 'true'
        run: pip install -r requirements.lock

      # Both halves are gates: check exits 0 only on a clean lint, format
      # --check only when no file would be rewritten.
      - name: ruff check (lint)
        if: steps.changes.outputs.real == 'true'
        run: ruff check .

      - name: ruff format --check (format)
        if: steps.changes.outputs.real == 'true'
        run: ruff format --check .

      # Deliberately REDUNDANT with the two steps above: the same pinned ruff
      # (hook rev matches requirements.lock), plus check-yaml, whitespace and
      # secret checks on files the lint job's working-directory never sees
      # (workflows, Procfile, compose).
      # `--all-files`, not diff-scoped: check-yaml exists because a workflow
      # that does not PARSE cannot be pushed, and the push carrying it is what a
      # diff-scoped run would have to notice.
      # The hook store is cached; the config is committed and revs are SHAs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.real == 'true'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ github.sha }}
          restore-keys: pre-commit-

      - name: pre-commit run --all-files
        if: steps.changes.outputs.real == 'true'
        run: pre-commit run --all-files --show-diff-on-failure

      # Scoped to common/ and orders/state.py - the RBAC capability maps and
      # the order lifecycle machine, where a wrong value is a security or money
      # defect - and orders/state.py is also the mutation job's target.
      # Paths are on the command line, not a config `files` setting, so CI and a
      # local run cannot disagree: the config carries the RULES, this line the
      # SCOPE, and widening it is a visible diff.
      # The step name is QUOTED because it contains a colon; unquoted it becomes
      # a YAML mapping, the file stops parsing, and GitHub rejects the push so
      # every gate silently stops existing.
      - name: "mypy (scoped: common/ + orders/state.py)"
        if: steps.changes.outputs.real == 'true'
        run: mypy common/ orders/state.py

      # Fails on CRITICAL/HIGH only; moderate/low print and never block.
      # pip-audit carries NO severity in any format, so severity is resolved per
      # GHSA through the OSV API (`database_specific.severity`) - the same
      # database npm audit reads, so both halves of the gate agree on "high".
      # Fail-closed on what cannot be judged: an unresolvable severity is
      # BLOCKING (UNRATED vs UNRESOLVED), and a missing/unparseable report is an
      # error rather than a clean scan.
      - name: Dependency vulnerability audit (pip-audit, high/critical)
        if: steps.changes.outputs.real == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet "pip-audit==2.10.1"
          # Audits exactly what installs (the hash-pinned lock). pip-audit's own
          # exit status is not the gate; the classification below decides, so a
          # finding must not end the step with a bare failure.
          python -m pip_audit -r requirements.lock --format json -o pip-audit.json || true
          if [ ! -s pip-audit.json ]; then
            echo "::error::pip-audit produced no report; refusing to report a clean scan that did not happen."
            exit 1
          fi
          python - <<'PY'
          import json
          import sys
          import urllib.request

          BLOCKING = {"CRITICAL", "HIGH"}
          NON_BLOCKING = {"MODERATE", "MEDIUM", "LOW"}


          def severity(candidates):
              """GitHub severity of one advisory, resolved through OSV."""
              for advisory_id in candidates:
                  try:
                      with urllib.request.urlopen(
                          f"https://api.osv.dev/v1/vulns/{advisory_id}", timeout=30
                      ) as response:
                          payload = json.load(response)
                  except Exception as exc:  # noqa: BLE001 - reported, never swallowed
                      return "UNRESOLVED", f"{advisory_id} ({exc})"
                  level = (payload.get("database_specific") or {}).get("severity")
                  if level:
                      return level.upper(), advisory_id
              return "UNRATED", candidates[0] if candidates else "?"


          report = json.load(open("pip-audit.json"))
          blocking, notices, unjudged = [], [], []
          for dependency in report.get("dependencies", []):
              for vuln in dependency.get("vulns", []):
                  ids = [vuln["id"], *(vuln.get("aliases") or [])]
                  ids = [i for i in ids if i.startswith("GHSA-")] + [
                      i for i in ids if not i.startswith("GHSA-")
                  ]
                  level, source = severity(ids)
                  fix = ",".join(vuln.get("fix_versions") or []) or "none"
                  line = (
                      f"{dependency['name']}=={dependency['version']} {vuln['id']} "
                      f"severity={level} fix={fix} via {source}"
                  )
                  if level in BLOCKING:
                      blocking.append(line)
                  elif level in NON_BLOCKING:
                      notices.append(line)
                  else:
                      unjudged.append(line)

          print(
              f"pip-audit: {len(blocking) + len(notices) + len(unjudged)} finding(s) "
              f"({len(blocking)} critical/high, {len(notices)} moderate/low, "
              f"{len(unjudged)} unresolved)"
          )
          for line in notices:
              print(f"  notice (does not block): {line}")
          for line in unjudged:
              print(f"  BLOCKING (severity not resolvable, fail-closed): {line}")
          for line in blocking:
              print(f"  BLOCKING: {line}")
          if blocking or unjudged:
              print(
                  "::error::pip-audit found CRITICAL/HIGH (or unresolvable) vulnerabilities; "
                  "bump the named packages. requirements.lock is hash-pinned, so recompile it "
                  "in the same change or pip will refuse the install."
              )
              sys.exit(1)
          print("pip-audit: no CRITICAL/HIGH findings.")
          PY
