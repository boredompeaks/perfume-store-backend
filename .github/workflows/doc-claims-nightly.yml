# Every action is pinned to a full commit SHA with its tag in a trailing
# comment; a mutable tag is a remote-controlled pointer. Never widen a pin.
#
# Full-corpus claim scan. backend-tests.yml scans only the diff on purpose (a
# gate that fails on prose nobody edited teaches people to ignore it); this is
# the complement for claims that went stale while their file sat still. A red
# run is a finding to report, not a reason to baseline the claim away.
#
# The second job measures comment/docstring/doc volume (#80) against the
# committed baseline. Scheduled, not a PR gate: failing every added comment
# would teach people to bypass the check. Same "red is a finding" contract.
name: doc-claims-nightly

on:
  schedule:
    # Nightly at 03:17 UTC. Scheduled runs are best-effort and are taken from
    # the repository's DEFAULT BRANCH; the slot itself is arbitrary but fixed,
    # so a missed window is visible as a gap rather than as a moving one.
    - cron: "17 3 * * *"
  # Manual runs, without editing the cron above (also the API entry point).
  workflow_dispatch:

# A scheduled workflow runs only from the default branch (master is legacy and
# never a target); workflow_dispatch can run any branch. Least privilege: the
# scan only reads its checkout.
permissions:
  contents: read

concurrency:
  group: doc-claims-nightly
  cancel-in-progress: true

jobs:
  full-corpus-claim-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan is a three-dot diff against --base, and
          # fetch-depth: 1 lacks the base object and merge base, aborting with a
          # git error instead of reporting claims. The base here is the ROOT
          # commit, so all history must be present.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # No pip install: scripts/doc_claims.py is stdlib-only, so an unreachable
      # package index cannot make this job red.
      - name: Documentation claim scan - full corpus (root commit to HEAD)
        run: |
          set -euo pipefail
          # The root commit (`git rev-list --max-parents=0 HEAD`): diffing from
          # it puts every tracked file in the diff, so no claim is skipped. The
          # sha is pinned, not a branch name, so the scope cannot shrink.
          BASE="84c8fa71164c23f1a955c67cfc71bd324545519f"
          status=0
          out="$(python scripts/doc_claims.py --base "${BASE}" 2>&1)" || status=$?
          printf '%s\n' "${out}"
          # The scanner's exit contract is the gate: 0 = no errors, 1 =
          # decidable errors, 2 = runtime error. The count is parsed for the
          # report ONLY -- prose parsing must never decide red or green.
          # Byte-safe because the separator is an em-dash emitted as cp1252
          # 0x97 on a pipe, which sed in a UTF-8 locale cannot match; `grep -a`
          # (corpus bytes are not always UTF-8) and `cut -d' ' -f1` are
          # locale-independent, and `-m1` takes the scanner's first line.
          errors="$(printf '%s\n' "${out}" | grep -a -m1 -o '[0-9][0-9]* error(s)' | cut -d' ' -f1)" || true
          {
            echo "### doc_claims full-corpus - base \`${BASE}\`"
            echo
            echo '```'
            printf '%s\n' "${out}" | grep -a -E '^(doc_claims: |  base )' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ -z "${errors}" ]; then
            echo "::warning::could not parse the error count from the scanner's summary line; the exit status below still decides the result."
          fi
          # Guards against the exit contract itself changing: an error count
          # with a zero exit would be a gate that reads an error and passes.
          if [ "${errors:-0}" -gt 0 ] && [ "${status}" -eq 0 ]; then
            echo "::error::scanner reported ${errors} error(s) but exited 0; its exit-code contract has changed and this workflow can no longer trust it."
            exit 1
          fi
          exit "${status}"

  # A ratchet, not an assertion: scripts/doc_metrics.py pins the definition and
  # scripts/doc_metrics_baseline.json is the committed baseline. Re-measures the
  # default branch and exits 1 when any ratio rose. Scheduled on purpose, and a
  # red run is a finding to report - NOT a reason to re-record the baseline.
  doc-metrics-trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # No pip install: stdlib-only, as above. `git ls-files` needs a checkout,
      # not history, so the default fetch-depth is enough here.
      - name: Comment/doc volume against the committed baseline (doc_metrics)
        run: |
          set -euo pipefail
          out="$(python scripts/doc_metrics.py check 2>&1)" && status=0 || status=$?
          printf '%s\n' "${out}" | tee -a "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
