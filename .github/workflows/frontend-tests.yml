# Every action is pinned to a full commit SHA with the tag in a trailing
# comment: a mutable tag is a remote-controlled pointer, so pinning is
# supply-chain hardening. Resolve bumps with `git ls-remote ... refs/tags/<tag>^{}`
# and replace the SHA - never widen the pin back to a tag.
#
# Every pin targets an action running on node24: GitHub deprecates the Node 20
# runtime. A future bump must keep `runs.using` at node24 or newer.
name: frontend-tests

on:
  push:
    branches: [spec-comp, feat/add-frontend, master]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    branches: [spec-comp, feat/add-frontend, master]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

# The suite only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic: vitest (node env, no network) + next build. Every NEXT_PUBLIC_*
  # has a code fallback EXCEPT NEXT_PUBLIC_ADMIN_ORIGIN, which is fail-if-unset
  # by owner contract (src/app/admin/page.tsx); the build step supplies that one
  # value without weakening the guard.
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build (next build)
        # The one workflow-provided value: the admin origin has no fallback and
        # `next build` fails without it; the product guard stands.
        env:
          NEXT_PUBLIC_ADMIN_ORIGIN: https://api.boredompeaks.me
        run: npm run build

      # Dependency vulnerability gate; `--audit-level=high` is the policy
      # (mirrors pip-audit): high/critical fail, moderate/low stay green.
      # Runs LAST so functional evidence is produced before a red audit, and the
      # job is path-filtered to frontend/** so it cannot fail a backend change.
      # Deliberate caveat: npm audit reads the registry's advisory DB, so an
      # unreachable registry fails the step rather than reading as a clean scan.
      - name: Dependency vulnerability audit (npm audit, high/critical)
        run: npm audit --audit-level=high

  # Disabled by default BY DESIGN: the suite drives the real Razorpay widget
  # against live servers, which is not hermetic and would need credentials as
  # repo secrets (forbidden; Razorpay is always mocked). Flip E2E_ENABLED to
  # "true" only after the suite is reworked to be hermetic.
  e2e:
    needs: unit-build
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests (playwright)
        run: npm run test:e2e
