# Publishes the backend image to GHCR under the owner's namespace, keeping the
# deployment white-label: any host can pull a generic image. GHCR avoids a
# cloud-specific registry secret - the job uses GITHUB_TOKEN plus
# `packages: write`.
#
# Backend-only by design (the frontend ships through its own pipeline); the
# image is backend/Dockerfile's multi-stage slim, non-root build. deploy.yml
# remains the documented BACKUP release path, dormant behind DEPLOY_ENABLED.
# Neither workflow runs tests: publishing is triggered only by pushes
# backend-tests already covered on the same SHA.
#
# Tag discipline: branch + full commit SHA, so a deployment traces to its exact
# commit and a rollback is a retag to a previous sha- tag. Pull requests build
# but never publish (`push: false` below), so no unmerged head reaches the
# registry.
name: ghcr-publish

on:
  push:
    branches: [spec-comp, feat/add-frontend]
    # Frontend-only or root-doc-only pushes skip; backend/docs/** matches
    # backend/**, so a backend docs-only change still spends a build.
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/**"
      - ".github/workflows/ghcr-publish.yml"
  pull_request:
    branches: [spec-comp, feat/add-frontend]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Procfile"
      - "scripts/**"
      - ".github/workflows/ghcr-publish.yml"
  workflow_dispatch:

# Least privilege; the job below widens only what publishing needs.
permissions:
  contents: read

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ghcr.io rejects uppercase paths; the lowercase expansion keeps a repo
      # rename from causing a silent registry 403.
      - name: Compute the lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
