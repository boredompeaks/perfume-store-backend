# Deploy OpenNext frontend to Cloudflare Worker on push to feat/add-frontend.
name: frontend-deploy

on:
  push:
    branches: [feat/add-frontend]
    paths: ["frontend/**", ".github/workflows/frontend-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install OpenNext + wrangler
        run: npm install --no-fund --no-audit

      - name: OpenNext build
        # Hermetic deploy env: NEXT_PUBLIC_ADMIN_ORIGIN is fail-if-unset by
        # owner contract (src/app/admin/page.tsx), so the workflow supplies the
        # constant; the product guard stands.
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.boredompeaks.me
          NEXT_PUBLIC_SITE_URL: https://test.boredompeaks.me
          NEXT_PUBLIC_ADMIN_ORIGIN: https://api.boredompeaks.me
          NEXTJS_ENV: production
          # Repo VARIABLE, not a secret: NEXT_PUBLIC_* is inlined into the
          # public bundle, so a secret label would be false. Empty disables the
          # SDK rather than breaking the build.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Repo variable; unset keeps 1.0, and an out-of-range value falls
          # back to 1.0, so a typo cannot silence reporting.
          NEXT_PUBLIC_SENTRY_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_SAMPLE_RATE }}
        run: npx opennextjs-cloudflare build

      # Next 16.4 + OpenNext: loadManifest rejects preview-props.json (upstream
      # opennextjs/opennextjs-cloudflare#1448). Remove once a release ships the fix.
      - name: Patch OpenNext preview-props allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path(".open-next/server-functions/default/handler.mjs")
          t = h.read_text()
          needle = 'p.endsWith("prefetch-hints"))return{}'
          if 'p.endsWith("preview-props")' not in t and needle in t:
              h.write_text(t.replace(needle, 'p.endsWith("prefetch-hints")||p.endsWith("preview-props"))return{}', 1))
              print("patched")
          else:
              print("no patch needed")
          PY

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
