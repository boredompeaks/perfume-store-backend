# Nightly SQLite leg: PostgreSQL is the AUTHORITATIVE CI engine (backend-tests.yml);
# SQLite is measured here, nightly, never per PR.
#
# Never a gate: schedule + workflow_dispatch only, so it cannot block a PR. It
# is the SERIAL reference for the parallel PostgreSQL job's statement baseline,
# and it ASSERTS its engine because settings.py falls back to SQLite silently
# when DATABASE_URL is unset - an inherited URL would make this a duplicate
# PostgreSQL run under a SQLite name.
name: sqlite-nightly

on:
  schedule:
    # 03:41 UTC: off the hour and off doc-claims-nightly's 03:17, so the two
    # crons do not queue behind each other.
    - cron: "41 3 * * *"
  workflow_dispatch:

# The suite only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: sqlite-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-nightly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The live-Redis THROTTLE-CACHE pins skip when REDIS_URL is undeclared,
      # so declaring it runs the same 0-skip suite shape PostgreSQL certifies.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Hermetic, as in backend-tests.yml: no real .env, and dummy Razorpay
      # values so the suite never needs live credentials.
      DJANGO_DEBUG: "true"
      RAZORPAY_KEY_ID: rzp_test_CI_DUMMY
      RAZORPAY_KEY_SECRET: ci-dummy-secret
      REDIS_URL: redis://localhost:6379/0
      # DATABASE_URL deliberately ABSENT: it selects PostgreSQL.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # requirements.lock is the hash-pinned resolution every job installs
      # from; a second install path would let this leg disagree with the gate.
      - name: Install pinned dependencies from the lock
        run: pip install -r requirements.lock

      # settings.py falls back to SQLite silently, so "the nightly ran" must
      # not be mistaken for "SQLite ran".
      - name: Assert the engine is SQLite
        run: |
          set -euo pipefail
          engine="$(python -c "import os,django;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');django.setup();from django.db import connection;print(connection.settings_dict['ENGINE'])")"
          echo "engine=${engine}"
          if [ "${engine}" != "django.db.backends.sqlite3" ]; then
            echo "::error::expected django.db.backends.sqlite3, got ${engine} -- this leg would certify the wrong engine."
            exit 1
          fi

      # Serial on purpose: no --parallel means no tblib shim or coverage combine,
      # and the total is directly comparable to the parallel job's combined one.
      # `pipefail` makes THIS step carry the runner's status - a bare `| tee`
      # would report tee's 0 and a failing suite would read green. The two steps
      # below run `if: always()` so a red night still publishes diagnostics, and
      # they cannot turn it green (it is already red).
      - name: Full SQLite suite (serial, coverage)
        run: |
          set -euo pipefail
          python -m coverage run manage.py test --verbosity 0 --noinput 2>&1 | tee sqlite-suite.log

      - name: Coverage report (fail_under=90)
        if: always()
        run: python -m coverage report --fail-under=90

      # Same partial-data guard as the PostgreSQL job, on the serial leg:
      # 14005 statements is the reference both engines measured, 2468 the
      # certified test count. Shrank = red, grew = notice, unparseable = red.
      - name: Partial-data invariant (statements + test count)
        if: always()
        run: |
          set -euo pipefail
          statements_baseline=14005
          tests_baseline=2468
          # `|| true` so an unreadable report reaches the explicit "could not
          # parse" branch with its own message instead of aborting silently.
          statements="$( (python -m coverage report || true) | awk '$1=="TOTAL"{print $2; exit}')"
          tests="$( (grep -E '^Ran [0-9]+ tests' sqlite-suite.log || true) | tail -1 | awk '{print $2}')"
          echo "sqlite statements=${statements:-<unparsed>} (baseline ${statements_baseline})"
          echo "sqlite tests=${tests:-<unparsed>} (baseline ${tests_baseline})"
          for pair in "statements:${statements}:${statements_baseline}" "tests:${tests}:${tests_baseline}"; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            value="${rest%%:*}"
            baseline="${rest#*:}"
            case "${value}" in
              ''|*[!0-9]*)
                echo "::error::could not parse the ${name} count (${name}=${value:-empty}); refusing to certify a number that was not read."
                exit 1
                ;;
            esac
            if [ "${value}" -lt "${baseline}" ]; then
              echo "::error::${name} shrank to ${value} (baseline ${baseline}) -- this run is PARTIAL. If the drop is intended, lower the baseline in this step in the same commit."
              exit 1
            fi
            if [ "${value}" -gt "${baseline}" ]; then
              echo "::notice::${name} grew to ${value} (baseline ${baseline}) -- raise the baseline in this step in the same commit that grew it."
            fi
          done
