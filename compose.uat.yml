# UAT overlay for scripts/release-uat.sh (`-f docker-compose.yml -f compose.uat.yml`).
# PostgreSQL/Redis run as standalone containers on the external `perfume-net`,
# while the base file's services join the project-default network; without this
# attachment the backend cannot resolve them and the health gate never passes.
# Env contract and fail-closed guards stay in the base file: this overlay
# carries no environment of its own, and db/redis/worker are never started here.

services:
  backend:
    networks:
      - perfume-net

networks:
  perfume-net:
    # External: the UAT host owns this network (release-uat.sh creates it).
    # `name:` pins the bare host-side name; otherwise the key above would be
    # project-prefixed and miss the real network.
    name: perfume-net
    external: true
