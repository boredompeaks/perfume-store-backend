# Ruff configuration -- lint AND format, one file (GATE-1, owner directive
# 2026-10-04). `ruff format` is the formatter of record for this tree from this
# commit on: Black's opinion is still measured (see the GATE-1 row in
# docs/changes.md) but no longer decides anything. Both halves run in
# .github/workflows/backend-tests.yml and both must exit 0.
#
# Every ruff figure below was measured with ruff 0.16.10, run from backend/ on
# the tree as it stood BEFORE this file, so no config was in play; they were
# re-derived from that same tree in the GATE-1 fix cycle, and the formatter
# figure is given both ways because this file's own exclude changes it:
#   ruff check .           -> exit 1, 362 errors across 24 distinct rules
#   ruff format --check .  -> exit 2, 124 files would be reformatted; with the
#                             extend-exclude below applied, exit 1 and 122 --
#                             the 122 the reformat then rewrote
#   black --check .        -> exit 1, 110 files would be reformatted, 82 clean

[tool.ruff]
# The repo convention (docs/conventions.md: "Black-compatible formatting (88
# cols, no tabs)") and ruff's own default, stated so the lint half and the
# format half cannot drift apart.
line-length = 88

# A measured exclusion, not an oversight: ruff's formatter rewrites Python
# code blocks inside Markdown as well as .py source, and on this tree it
# cannot even read one of the docs --
#   ruff format --check .  -> exit 2
#   io: stream did not contain valid UTF-8
#   --> docs/run/section-22.md:1:1        (byte 0x97 at offset 5618)
# A gate that dies on an invalid-UTF-8 blob can never be green, and rewriting
# prose is outside this commit's declared scope: docs/ byte integrity is a
# separate gate (scripts/doc_claims.py, whose baseline covers
# backend/docs/changes.md), and a code formatter churning prose produces a
# diff no reviewer can reason about. Scope the formatter to Python source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Explicit, and narrower than ruff 0.16.10's out-of-the-box default. The four
# families taken are the ones a Black-compatible Python gate is built from:
# pycodestyle (E, W), pyflakes (F), import sorting (I). Every family NOT taken
# is named here with its measured count -- deliberately unselected, never
# silently dropped:
#   RUF  167 (RUF012 151, RUF059 16): RUF012 wants ClassVar annotations on
#        mutable class defaults, and those sites are Django models,
#        serializers and test class bodies -- per-site review, not a pass a
#        formatter can stand behind.
#   SIM  57, BLE 10, C4 9, FURB 14, PLW 5, DTZ 2, UP 3, RET 2, ISC 2, B 2,
#        TRY 1, PIE 1 -- 275 of the 362 above, summed from the same
#        `--statistics` output: opinionated rewrites (merge nested `with`,
#        narrow a blind `except`, dict() -> {} literal, regex flag aliases,
#        ...) where on this codebase "fix" and "behaviour change" are the same
#        move.
# Each is one config line plus its own fix commit whenever someone wants it;
# enabling them today and ignoring them one at a time would be this same
# exclusion written out in a longer file.
select = ["E", "F", "W", "I"]

# E501 only -- every other selected rule stays live. Line length belongs to
# the FORMATTER: it took this tree from 330 lines over 88 down to 49
# (measured with `ruff check --select E501` before and after `ruff format`).
# The 49 it cannot reach are comments, string literals and `help_text` inside
# migrations -- editing a historical migration to satisfy a linter is worse
# than the violation -- e.g. accounts/tests.py section dividers,
# accounts/views.py response payloads, ops/migrations/0002_*.py. Splitting
# those changes user-visible strings or authored prose; that is an edit, not
# a reformat, and it is out of this gate.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# F841 fires exactly once here, on `candidate = int(normalized)` in
# verify(), and the line only LOOKS dead: str.isdigit() approves forms int()
# refuses (measured: "²".isdigit() is True, int("²") raises ValueError), so
# that conversion is the only thing separating today's 500 from a silent
# "invalid code" for such input. Deleting the binding deletes the guard, so
# the violation is kept with a written reason instead of being fixed by
# removal. The follow-up that would retire this ignore is to compare
# str(candidate) so exotic digits can match at all (proposed, not shipped).
"common/totp.py" = ["F841"]

[tool.mypy]
# mypy, scoped and incremental (TIER-2, item 4).
#
# SCOPE, and it is deliberate: `common/` plus `orders/state.py` only. Two files
# carry the RBAC capability maps and the order lifecycle machine -- the two
# places where a wrong value is a security or money defect rather than a
# cosmetic one -- and `orders/state.py` is additionally the file the weekly
# mutation job targets (`paths_to_mutate` above), so a type error there is an
# error in the code the mutation gate is already reasoning about.
#
# This is a SCOPE, not a claim that the rest of the tree is typed. Turning
# mypy loose on all of backend/ is a different and much larger piece of work;
# widening this one line is how that work is scheduled. Measured baseline for
# the record: `mypy common/ orders/state.py` over the tree as it stood before
# this config reported 86 errors in 24 of 26 files, of which all but 8 were
# `import-untyped` noise from Django and DRF shipping no stubs. With
# `ignore_missing_imports` the real figure is 8, in 2 files, and all 8 are
# fixed by this commit: 7 `var-annotated` (bare `{}` / `frozenset()` defaults
# with nothing to infer from) and 1 `return-value`.
#
# `ignore_missing_imports = true` is the load-bearing setting and NOT a
# silencing of real errors. Django and DRF ship no `py.typed` marker, so
# without it every import in scope is an `import-untyped` error and the gate
# reports 86 errors of which 78 are the same fact about two libraries. Turning
# those off is what makes the remaining errors worth reading. The alternative
# -- `django-stubs` -- would type the framework properly and is deliberately
# NOT adopted here: it adds a dependency and a large annotation surface to a
# scoped gate, and every stub-mediated result would have to be re-derived before
# it could be trusted. That is the follow-up, not this task.
ignore_missing_imports = true

# Nothing in this scope is annotated at the function boundary yet, so the
# default "check untyped defs = off" behaviour would let a type error through
# every function body that lacks annotations -- which is most of them. Turning
# it on is what makes this gate say something about the code that exists
# rather than only about the annotations somebody wrote.
check_untyped_defs = true

# Report the note that says which file is missing stubs for a named module,
# without failing on it. With `ignore_missing_imports` above these are already
# not errors; the note is what makes the boundary visible to the next person
# instead of invisible.
warn_unused_configs = true

# No `strict`: `disallow_untyped_defs` would demand a signature on every
# function in scope, which is the whole-tree annotation task this gate exists to
# defer. Adding it would make this config permanently red rather than
# incrementally useful.

# Two per-module suppressions, and each is a MEASURED absence of stubs rather
# than a tolerated defect. Both were checked against the runtime before being
# excluded -- an exclusion here is a claim, and an unchecked one is exactly how
# a real bug gets filed as "known".
#
# common/saved_filters.py -- `has_view_or_change_permission` and
# `changelist_view` are reported as missing/undefined on the superclass, which
# is FALSE: both exist on `django.contrib.admin.ModelAdmin` (verified at
# runtime with `hasattr` on the real class). Django ships no `py.typed`, so
# with `ignore_missing_imports` above, mypy cannot see the base class's
# members and treats the MRO as empty. Editing correct code to satisfy that
# would be the wrong fix.
#
# orders/models.py -- `sorted(RETURN_ALLOWED_TRANSITIONS.get(status, set()))`
# is reported as passing `set[tuple[str, str]]` where `Iterable[str]` is
# expected. `RETURN_ALLOWED_TRANSITIONS` is inferred from a dict literal whose
# values are sets of two-tuples elsewhere in the file, while this call site
# passes a bare `set()` default and joins the result with ", " -- so the
# annotation is a stale inference from a DIFFERENT use of the same constant,
# not a runtime fault. `orders/models.py` is also outside this task's declared
# scope; correcting an unrelated module's inference is the follow-up that
# `django-stubs` would settle properly.
[[tool.mypy.overrides]]
module = ["common.saved_filters", "orders.models"]
# `attr-defined` = the missing-superclass-member report above. `misc` =
# "changelist_view undefined in superclass", the same absence. `arg-type` =
# the set-vs-tuple inference above. Follow-imports stays on so the REAL
# annotations in these files are still checked; only these three codes, which
# are all artifacts of an unstubbed framework, are silenced.
disable_error_code = ["attr-defined", "misc", "arg-type"]

[tool.mutmut]
# Mutation-runner config for the weekly job (.github/workflows/mutation-weekly.yml). The hand-written prose evidence this complements lives in
# scripts/mutation_evidence.py + scripts/mutation_evidence/*.json: that script
# REPLAYS mutations a human already recorded and checks the figures the
# changelog printed. Nothing there picks a mutant on its own, so a claim can
# only ever be about a mutation somebody thought to write down. mutmut generates
# its own, so the question "which of these lines has no test" gets an answer
# nobody had to remember to ask.
#
# Two files, named exactly. mutmut 2.5.1's `paths_to_mutate` is a real
# per-file allow-list (measured, not assumed: it is what narrowed this to
# orders/state.py + common/permissions.py). The rejected alternative is
# recorded in the workflow header because the reason is not obvious.
paths_to_mutate = "orders/state.py,common/permissions.py"

# Mutate only lines a test actually executes. Measured on this tree at the
# pinned runner: 246 mutants without it, 186 with it. The 60 dropped are on
# lines no test in the scoped runner reaches, so they are guaranteed survivors
# -- they would report as test-suite weakness when they are in fact untested
# LINES. mutmut reads the same .coverage database either way, so this narrows
# what is mutated and never what runs.
use_coverage = true

# Emoji progress bars are unreadable in a CI log and crash on a cp1252 console
# (this repo has already had to work around a 0x97 byte emitted to a pipe --
# see the byte-safe grep in doc-claims-nightly.yml). Plain text only.
simple_output = true

# ...and the progress INDICATOR itself has to go, which simple_output does not
# do. Measured on this repo: with only simple_output above, the run dies at
#   UnicodeEncodeError: 'charmap' codec can't encode character '\u280b'
# from mutmut's braille spinner on the first baseline run, because mutmut
# writes it straight to sys.stdout. This is the key that fixes it -- the
# spinner is gated on no_progress, not on simple_output. Both keys default to
# false, so both are read from here; they are set together deliberately.
no_progress = true
