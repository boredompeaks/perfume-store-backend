# Orchestration: backend image, PostgreSQL, and the async substrate (Redis
# broker, Celery worker, Celery beat). The storefront deploys separately
# (frontend-deploy.yml). App configuration comes only from the env contract in
# backend/.env.example, passed through via env_file; nothing here can drift
# from what settings.py reads.
#
# Local: docker compose up -d --build; then curl http://localhost:8000/health/
# Release (migrations): scripts/release.sh - this file never migrates.
#
# A non-debug boot refuses to start without DJANGO_ENV and CSRF_TRUSTED_ORIGINS
# (compose fails closed on the latter). TLS hardening is ON with production
# defaults, so a plain-HTTP local run must set SECURE_SSL_REDIRECT=false and
# SECURE_HSTS_SECONDS=0 in the repo-root .env. DATABASE_URL/REDIS_URL there
# override the in-network defaults.

name: perfume-store

# The ONE definition of DATABASE_URL, referenced by backend, worker and beat,
# assembled from the same POSTGRES_* variables the db service reads so the
# password has one home (.env). The :? is a fail-closed guard: an unset
# password must abort compose - never weaken or remove it.
x-database-url: &database-url "${DATABASE_URL:-postgres://${POSTGRES_USER:-perfume}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env}@db:5432/${POSTGRES_DB:-perfume_store}?sslmode=disable}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perfume}
      POSTGRES_DB: ${POSTGRES_DB:-perfume_store}
      # No default on purpose: an unset password must abort, not bring up a
      # world-readable database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # "Accepting connections" is the only readiness `migrate` needs.
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      # backend/ is the context, which is what makes backend/.dockerignore apply.
      context: ./backend
    image: perfume-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        # Wait for "accepting connections", not "started": release migrates
        # before the app is up.
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # From the x-database-url anchor so the password has one home and cannot
      # drift from the database it names. sslmode=disable is correct only here:
      # in-network container, not a remote database (settings forwards query
      # params into the Postgres OPTIONS dict, so the value is real). A
      # DATABASE_URL in .env overrides it, which is why the anchor is
      # interpolated here rather than left to env_file, which this block
      # outranks.
      DATABASE_URL: *database-url
      # Static files live inside the image; whitenoise serves them.
      DJANGO_STATIC_ROOT: /app/staticfiles
      # Non-debug boot guards: without both keys the image refuses to import
      # and gunicorn crash-loops. DJANGO_ENV defaults to production (set local
      # for local work); origins are REQUIRED rather than defaulted, because a
      # localhost default is exactly the unconfigured deployment the guard
      # refuses - so compose names the missing key up front.
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in the repo-root .env}"
      # TLS hardening ON with production defaults; a plain-HTTP local run
      # overrides SECURE_SSL_REDIRECT=false / SECURE_HSTS_SECONDS=0 in .env.
      # SECURE_PROXY_SSL_HEADER_NAME is the WSGI environ name
      # (HTTP_X_FORWARDED_PROTO), not the bare header name: the latter silently
      # never matches and every proxied request looks plain HTTP, looping the
      # redirect. Set it only behind a proxy that sets the header on every
      # request.
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-true}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}"
      # Not defaulted on: includeSubDomains breaks plain-HTTP subdomains and
      # preload is effectively irreversible, so operators opt in.
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-false}"
      SECURE_PROXY_SSL_HEADER_NAME: "${SECURE_PROXY_SSL_HEADER_NAME:-HTTP_X_FORWARDED_PROTO}"
      SECURE_PROXY_SSL_HEADER_VALUE: "${SECURE_PROXY_SSL_HEADER_VALUE:-https}"
    ports:
      - "8000:8000"
    volumes:
      # Named volume seeded from the image so /app/media stays writable by the
      # non-root appuser; /health/ reports degraded otherwise.
      - media_data:/app/media
    healthcheck:
      # Probes the real /health/ (DB + media mount; 503 while degraded), so a
      # failure is a real signal, not just "process is up". Port must match the
      # image's PORT=8000. Host is the first ALLOWED_HOSTS entry (an unlisted
      # Host is a 400) and X-Forwarded-Proto satisfies the proxy pair, so
      # SECURE_SSL_REDIRECT does not bounce the probe to https:// the container
      # does not serve. Both read the same env the app is configured with.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          host = (os.environ.get("DJANGO_ALLOWED_HOSTS") or "").split(",")[0].strip()
          req = urllib.request.Request(
              "http://127.0.0.1:8000/health/",
              headers={"Host": host, "X-Forwarded-Proto": "https"},
          )
          try:
              with urllib.request.urlopen(req, timeout=5) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Every Celery message crosses this broker; a service declaring REDIS_URL
  # also keeps its DRF throttle cache here. Pinned to the same major as the
  # redis client in requirements.lock (8.1.0): "float the minor, pin the
  # major", as CI does, since the version-sensitive behaviour is in the client.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      # Non-zero while the server refuses commands; release.sh's `up --wait`
      # blocks on this.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No volume, deliberately: the queue is transient (the durable copy is the
    # database outbox), so persisting would only replay old messages.

  # The Celery worker executes the queued sweeps via common/tasks.py. Same
  # image/tag as backend (only the CMD differs), so one build releases web and
  # async together.
  worker:
    image: perfume-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        # Sweeps write to the database, so wait for real readiness.
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Same anchor as backend: one password home, one database.
      DATABASE_URL: *database-url
      # Defaulted HERE because settings.py falls back to redis://localhost,
      # which inside a container is the container itself - a worker would fail
      # every publish. A .env value overrides it. backend deliberately gets no
      # such default: without REDIS_URL it serves on LocMemCache, keeping web
      # independent of redis' lifecycle.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      # Celery imports the same settings, so it needs the same boot-guard keys.
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in the repo-root .env}"
    command: celery -A config worker -l info
    # The image's HEALTHCHECK probes gunicorn's /health/, but a Celery
    # container serves nothing there, so inheriting it marks a healthy worker
    # UNHEALTHY. Disabled rather than replaced (`inspect ping` would judge
    # readiness through the broker it is judging); readiness is broker+db
    # healthy+process alive. Consequence: Compose `up --wait` refuses a service
    # with no healthcheck, so release.sh recreates worker/beat in a separate
    # plain `up -d`.
    healthcheck:
      disable: true

  # The Celery beat scheduler fires the CELERY_BEAT_* cadences (schedule in
  # config.settings, tasks in common/tasks.py). Without it nothing schedules
  # the sweeps, however healthy the worker is.
  beat:
    image: perfume-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Same anchor and boot-guard keys as the worker.
      DATABASE_URL: *database-url
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      DJANGO_ENV: "${DJANGO_ENV:-production}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in the repo-root .env}"
    # -s /tmp/...: beat's default schedule file lands in /app, which the image
    # leaves root-owned while the process runs as appuser; /tmp is writable.
    # Container-local state is enough - the schedule is code, and a duplicate
    # sweep is the same idempotent management command.
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    # Same inherited-HEALTHCHECK problem as the worker; same fix.
    healthcheck:
      disable: true

volumes:
  postgres_data:
  media_data: