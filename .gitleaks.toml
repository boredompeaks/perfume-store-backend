# gitleaks: allowlists ONLY documented dummy/test credentials. Never an
# escape hatch for real secrets -- investigate new credential-shaped values.
[extend]
useDefault = true

[allowlist]
  description = "Documented dummy/test credentials (never real secrets)"
  regexes = [
    '''\brzp_test_CI_DUMMY\b''',
    '''rzp_test_TESTINGONLYDO.?NOT.?USE''',
    '''TESTINGONLY[A-Za-z]*-DO-NOT-USE''',
    '''\bci-dummy-secret\b''',
    '''\bchange-me-to-a-long-random-string\b''',
    '''\bboss-pass-123\b''',
    '''\be2e-(Customer|Staff)-9\b''',
    # Test-fixture passwords, used only for throwaway users in the test DB.
    '''Ev1l-Passphrase-9\b''',
    '''S3cure-Passphrase!''',
    '''N3w-Passphrase-99\b''',
    '''An0ther-Pass-77\b''',
    '''\bGEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ\b''', # published RFC 6238 test vector, not a credential
    '''\bGEZDGNBV234567\b''', # synthetic base32 fragment for an otpauth-URI shape assertion
    '''\brzp_live_x\b''', # deliberately truncated, non-functional key id: proves the secret filter strips key-shaped values
  ]
